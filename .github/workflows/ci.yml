name: CI

# Primary development happens on Windows, where no Swift toolchain exists.
# This workflow is therefore the ONLY place LarioGo actually compiles and runs
# its tests. Treat a red build here as a broken commit.

on:
  push:
    # Every branch, not just main. Because nothing compiles on the Windows dev
    # machine, a feature branch that only builds after merge is useless — the
    # whole point is to find compile errors before they reach main.
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # NOT cancel-in-progress. The backend build takes ~8 minutes and pushes during
  # active work arrive faster than that, so superseding runs kept cancelling it
  # and its errors were never reported. Letting runs finish costs little: the
  # three Linux jobs bill at 1x, and the expensive macOS job is gated separately.
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Cheap, platform-independent guard. Runs in seconds and catches project
  # corruption (dangling pbxproj refs, missing shared scheme, dead assets)
  # before we pay for a macOS runner.
  # ---------------------------------------------------------------------
  project-integrity:
    name: Project integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Xcode project structure
        run: python tools/check_project.py

      - name: Self-test the simulator picker
        run: python tools/test_pick_simulator.py

      - name: Forbid third-party payment SDKs
        # LarioGo must stay provider-independent (Apple Pay / PassKit only).
        # Only source trees are scanned, so docs and this workflow can name
        # the forbidden vendor without failing the build.
        run: |
          if grep -rniE 'stripe' LarioGo LarioGoTests LarioGoUITests \
               $( [ -d Backend ] && echo Backend ) 2>/dev/null; then
            echo "::error::Forbidden payment SDK reference found in source."
            exit 1
          fi
          echo "Clean."

  # ---------------------------------------------------------------------
  # LarioCore: Foundation-only domain logic (models, geo, search, ranking).
  # No Apple frameworks, so it builds anywhere — including the Windows dev
  # machine. This is the one part of the product that gets tested before it
  # ever reaches CI.
  # ---------------------------------------------------------------------
  core:
    name: Core build & test
    runs-on: ubuntu-latest
    needs: project-integrity
    timeout-minutes: 20
    container:
      image: swift:5.9-jammy
    defaults:
      run:
        # The container runs steps with `sh` (dash) by default, which has no
        # `set -o pipefail`. bash is present in the image; ask for it.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM build
        uses: actions/cache@v4
        with:
          path: |
            Core/.build
          key: spm-core-${{ runner.os }}-${{ hashFiles('Core/Package.swift') }}
          restore-keys: |
            spm-core-${{ runner.os }}-

      - name: Swift version
        run: swift --version

      - name: Test
        working-directory: Core
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/core.log || {
            bash ../tools/summarise-build-log.sh /tmp/core.log
            exit 1
          }

      - name: Assert Core imports no Apple-only frameworks
        # The whole value of this target is that it compiles off-Apple. A stray
        # import would silently take that away.
        run: |
          if grep -rnE '^\s*import (SwiftUI|UIKit|MapKit|CoreLocation|AVFoundation|AppKit)' Core/Sources; then
            echo "::error::LarioCore must stay Foundation-only so it can build and test off Apple platforms."
            exit 1
          fi
          echo "Core is platform-independent. OK."

  # ---------------------------------------------------------------------
  # Vapor API. Runs on Linux against a real Postgres, which is both cheaper
  # and closer to production than a macOS runner.
  # ---------------------------------------------------------------------
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    needs: project-integrity
    timeout-minutes: 30

    container:
      image: swift:5.9-jammy

    defaults:
      run:
        # As above: the container's default shell is dash, not bash.
        shell: bash

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lariogo
          POSTGRES_PASSWORD: lariogo
          POSTGRES_DB: lariogo_test
        options: >-
          --health-cmd "pg_isready -U lariogo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: lariogo
      DATABASE_PASSWORD: lariogo
      DATABASE_NAME: lariogo_test
      DATABASE_DISABLE_TLS: 'true'
      # CI-only value. Production secrets never live in a workflow file.
      JWT_SECRET: ci-only-secret-key-that-is-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM build
        uses: actions/cache@v4
        with:
          path: |
            Backend/.build
          key: spm-backend-${{ runner.os }}-${{ hashFiles('Backend/Package.swift') }}
          restore-keys: |
            spm-backend-${{ runner.os }}-

      - name: Swift version
        run: swift --version

      - name: Build
        working-directory: Backend
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee /tmp/backend.log || {
            bash ../tools/summarise-build-log.sh /tmp/backend.log
            exit 1
          }

      - name: Test
        working-directory: Backend
        run: |
          set -o pipefail
          swift test --skip-build 2>&1 | tee /tmp/backend-test.log || {
            bash ../tools/summarise-build-log.sh /tmp/backend-test.log
            exit 1
          }

  # ---------------------------------------------------------------------
  # The real iOS build. This is what closes Implement -> Compile -> Test.
  # ---------------------------------------------------------------------
  ios:
    name: iOS build & test
    runs-on: macos-latest
    needs: project-integrity
    timeout-minutes: 40
    # macOS runners bill at 10x, so a full iOS build costs roughly 120 minutes
    # against the monthly allowance while the Linux jobs cost about 14 between
    # them. Run it where it matters - pull requests into main, direct pushes to
    # main, and on demand - rather than on every commit to a feature branch.
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[ios]')

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          ls /Applications | grep -i '^Xcode' || true
          xcodebuild -version
          swift --version

      - name: List schemes and targets
        run: xcodebuild -list -project LarioGo.xcodeproj

      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | python3 tools/pick_simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project LarioGo.xcodeproj \
            -scheme LarioGo \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project LarioGo.xcodeproj \
            -scheme LarioGo \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # The simulator build is unsigned, so it needs no Apple Developer account,
      # no certificate and no provisioning profile. Download this artifact and
      # drop it into a browser-based simulator host (Appetize.io and similar) to
      # actually use the app from a Windows machine.
      - name: Package simulator app
        if: success() || failure()
        run: |
          set -euo pipefail
          app=$(find DerivedData/Build/Products -maxdepth 2 -name 'LarioGo.app' -type d | head -1)
          if [ -z "$app" ]; then
            echo "No LarioGo.app found — the build did not get far enough."
            exit 0
          fi
          echo "Packaging $app"
          ditto -c -k --sequesterRsrc --keepParent "$app" LarioGo-simulator.zip
          echo "### Simulator build ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the \`LarioGo-simulator\` artifact below and upload it to a browser-based simulator host to run the app without a Mac. Unsigned — no Apple Developer account needed." >> "$GITHUB_STEP_SUMMARY"

      # We already pay for a macOS runner here, so capture the app running
      # rather than depending on a third-party streaming service with a free
      # tier. Screenshots and a video come back as artifacts, viewable on any
      # machine including Windows.
      - name: Capture screenshots from the simulator
        if: success() || failure()
        continue-on-error: true
        run: |
          set -uo pipefail
          udid="${{ steps.sim.outputs.udid }}"
          app=$(find DerivedData/Build/Products -maxdepth 2 -name 'LarioGo.app' -type d | head -1)
          if [ -z "$app" ]; then echo "No app built; nothing to capture."; exit 0; fi

          mkdir -p screenshots
          xcrun simctl bootstatus "$udid" -b || xcrun simctl boot "$udid" || true
          xcrun simctl install "$udid" "$app"

          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          echo "Launching $bundle_id"

          xcrun simctl io "$udid" recordVideo --codec h264 screenshots/session.mp4 &
          record_pid=$!

          xcrun simctl launch "$udid" "$bundle_id" || true
          # The splash screen holds for 1.4s; wait past it before the first shot.
          sleep 6
          xcrun simctl io "$udid" screenshot screenshots/01-explore.png || true
          sleep 2
          xcrun simctl io "$udid" screenshot screenshots/02-after-load.png || true

          kill -INT $record_pid 2>/dev/null || true
          wait $record_pid 2>/dev/null || true
          ls -la screenshots || true

      - name: Upload screenshots
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: LarioGo-screenshots
          path: screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload simulator app
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: LarioGo-simulator
          path: LarioGo-simulator.zip
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
